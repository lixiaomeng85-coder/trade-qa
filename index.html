<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外贸业务 Q&A 知识库</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7fb;color:#172033;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
header{background:#fff;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:20}.wrap{max-width:1120px;margin:auto;padding:0 20px}
.hero{padding:28px 0 20px}h1{margin:0;font-size:30px}.sub{margin:8px 0 18px;color:#6b7280}
.search{width:100%;padding:15px 17px;border:1px solid #d6d9e0;border-radius:12px;font-size:16px;outline:0}.search:focus{border-color:#4f46e5;box-shadow:0 0 0 3px #4f46e522}
.toolbar{display:flex;gap:8px;overflow:auto;padding:12px 0 2px}.chip{border:1px solid #d8dbe2;background:#fff;border-radius:999px;padding:7px 13px;white-space:nowrap;cursor:pointer}.chip.on{background:#4f46e5;color:#fff;border-color:#4f46e5}
main{padding:28px 0 55px}.top{display:flex;justify-content:space-between;gap:15px;color:#6b7280;font-size:14px;margin-bottom:15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:15px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:18px;cursor:pointer;transition:.15s;overflow:hidden}.card:hover{transform:translateY(-2px);box-shadow:0 10px 26px #11182712}
.card img{width:100%;height:170px;object-fit:cover;border-radius:11px;margin-bottom:13px}.tag{display:inline-block;background:#eef2ff;color:#4338ca;border-radius:999px;padding:4px 9px;font-size:12px}
.card h2{font-size:17px;line-height:1.5;margin:10px 0}.summary{color:#596273;line-height:1.7;font-size:14px}.more{margin-top:12px;color:#4f46e5;font-size:14px;font-weight:600}
.detail{background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:26px;max-width:920px;margin:auto}.back{border:0;background:none;color:#4f46e5;padding:0;margin-bottom:18px;cursor:pointer;font-size:15px}
.detail h2{font-size:29px;margin:5px 0 10px}.detail .cover{max-width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin:12px 0 20px}.answer{background:#f8fafc;border:1px solid #eef0f3;border-radius:12px;padding:16px;line-height:1.75}
.body{line-height:1.9;color:#374151}.body h2,.body h3{color:#172033;margin-top:26px}.body img{display:block;max-width:100%;border-radius:13px;margin:14px 0}.body a{color:#4f46e5}
.spanish{margin-top:20px;background:#f5f3ff;border:1px solid #ddd6fe;border-radius:13px;padding:15px}.spanish pre{white-space:pre-wrap;font:inherit;line-height:1.7;margin:10px 0}
.copy{border:0;border-radius:9px;background:#111827;color:#fff;padding:9px 13px;cursor:pointer}
.notice{margin-top:22px;padding:14px 16px;background:#fff7ed;border:1px solid #fed7aa;border-radius:13px;color:#9a3412;line-height:1.65;font-size:14px}
.empty{text-align:center;padding:60px;color:#6b7280}footer{text-align:center;color:#9ca3af;padding:30px}
@media(max-width:600px){.wrap{padding:0 14px}h1{font-size:25px}.detail{padding:19px}.detail h2{font-size:23px}}
</style>
</head>
<body>
<header><div class="wrap hero">
<h1>📚 外贸业务 Q&A 知识库</h1>
<div class="sub">搜索问题 · 分类筛选 · 查看详细流程 · 图片资料 · 一键复制西语话术</div>
<input class="search" id="search" placeholder="搜索 FOB、DDP、阿根廷、付款、订舱、HS 编码……">
<div class="toolbar" id="cats"></div>
</div></header>
<main><div class="wrap">
<div id="listView"><div class="top"><span id="count">正在加载…</span><span>点击卡片查看详情</span></div><div class="grid" id="grid"></div></div>
<div id="detailView" style="display:none"></div>
<div class="notice">⚠️ 本知识库根据公司现有《工作Q&A.pdf》整理。原资料部分规则存在冲突或信息不完整，例如部分国家 DDP、40NOR 容量等；遇到这类问题请以公司最新规则及货代确认结果为准。</div>
</div></main><footer>外贸业务 Q&A 知识库</footer>
<script>
const owner="lixiaomeng85-coder", repo="trade-qa", branch="main";
let all=[], currentCat="全部";
const $=id=>document.getElementById(id);
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
function parseMd(md){
 let front={}, body=md;
 if(md.startsWith("---")){
   const end=md.indexOf("\n---",3);
   if(end>0){
     md.slice(3,end).trim().split("\n").forEach(line=>{
       const i=line.indexOf(":");
       if(i>0){
         let k=line.slice(0,i).trim(), v=line.slice(i+1).trim();
         v=v.replace(/^"(.*)"$/,"$1").replace(/\\\"/g,'"');
         front[k]=v;
       }
     });
     body=md.slice(end+4).trim();
   }
 }
 return {...front, body};
}
function mdToHtml(md){
 let s=esc(md);
 s=s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'< img alt="$1" src="$2">');
 s=s.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>");
 s=s.replace(/\*\*(.*?)\*\*/g,"<strong>$1</strong>");
 s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
 s=s.replace(/\n\n/g,"<br><br>").replace(/\n/g,"<br>");
 return s;
}
async function load(){
 try{
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/content/qa?ref=${branch}`,{cache:"no-store"});
  if(!r.ok) throw new Error("GitHub API error "+r.status);
  const files=await r.json();
  const mdFiles=files.filter(x=>x.name.endsWith(".md"));
  all=await Promise.all(mdFiles.map(async f=>({...parseMd(await (await fetch(f.download_url+"?v="+Date.now())).text()),slug:f.name.slice(0,-3)})));
  buildCats(); render();
 }catch(e){$("count").textContent="知识库加载失败，请检查 GitHub 文件路径。";console.error(e)}
}
function buildCats(){
 const cats=["全部",...new Set(all.map(x=>x.category).filter(Boolean))];
 $("cats").innerHTML=cats.map(x=>`<button class="chip ${x===currentCat?"on":""}" data-cat="${esc(x)}">${esc(x)}</button>`).join("");
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{
    currentCat=b.dataset.cat;
    if($("detailView").style.display !== "none"){
        showList();
    }
    buildCats();
    render();
 });
}
function render(){
 const kw=$("search").value.trim().toLowerCase();
 const rows=all.filter(x=>(currentCat==="全部"||x.category===currentCat)&&(`${x.title} ${x.summary} ${x.category} ${x.spanish} ${x.body}`.toLowerCase().includes(kw)));
 $("count").textContent=`找到 ${rows.length} 条 / 共 ${all.length} 条`;
 $("grid").innerHTML=rows.map(x=>`<article class="card" onclick="openDetail('${encodeURIComponent(x.slug)}')">
   ${x.cover?`< img src="${esc(x.cover)}" alt="">`:""}
   <span class="tag">${esc(x.category||"其他")}</span>
   <h2>${esc(x.title)}</h2><div class="summary">${esc(x.summary||"")}</div><div class="more">查看详细信息 →</div>
 </article>`).join("");
 if(!rows.length) $("grid").innerHTML='<div class="empty">没有找到相关内容，换个关键词试试。</div>';
}
$("search").addEventListener("input",render);
function openDetail(encoded){
 const x=all.find(a=>a.slug===decodeURIComponent(encoded)); if(!x)return;
 $("listView").style.display="none"; $("detailView").style.display="block";
 $("detailView").innerHTML=`<section class="detail">
   <button class="back" onclick="showList()">← 返回 Q&A 列表</button>
   <span class="tag">${esc(x.category||"其他")}</span>
   <h2>${esc(x.title)}</h2>
   ${x.cover?`< img class="cover" src="${esc(x.cover)}" alt="">`:""}
   <div class="answer"><strong>📌 简短答案</strong><br>${esc(x.summary||"")}</div>
   <div class="body">${mdToHtml(x.body||"")}</div>
   ${x.spanish?`<div class="spanish"><strong>🇪🇸 西班牙语话术</strong><pre id="spanishText">${esc(x.spanish)}</pre><button class="copy" onclick="copySpanish()">复制话术</button></div>`:""}
 </section>`;
 window.scrollTo({top:0,behavior:"smooth"});
}
function showList(){$("detailView").style.display="none";$("listView").style.display="block";window.scrollTo({top:0,behavior:"smooth"})}
function copySpanish(){
 const t=$("spanishText")?.innerText||"";
 navigator.clipboard.writeText(t).then(()=>alert("已复制 ✅")).catch(()=>alert(t));
}
load();
</script>
</body></html>
